services:
  db:
    image: postgres:17
    container_name: gymflow-db
    environment:
      POSTGRES_DB: gymflow
      POSTGRES_USER: gymflow
      POSTGRES_PASSWORD: gymflow
    ports:
      - "5433:5432"
    volumes:
      - gymflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymflow -d gymflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  gymflow-data:
